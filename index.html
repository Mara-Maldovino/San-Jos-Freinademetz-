<script id="data" type="application/json">{"h":{"k":"San José Freinademetz","t":"Apóstol y Misionero en China","q":"«El idioma que todos entienden es el amor»","w":"¡Sean bienvenidos hermanos y hermanas, a un espacio inspirado en el primer misionero verbita en China, donde la fe se hace encuentro y el amor derriba todas las fronteras!"},"s":[{"id":"frases","nav":"Frases","type":"cards","cls":"g2","k":"Pensamiento y testimonio","title":"Frases célebres de San José Freinademetz","items":[{"t":"«El amor es el único lenguaje que comprenden todos los hombres.»","s":"","d":"Principio fundamental de su apostolado e inculturación en China."},{"t":"«Llegar a ser misionero no es un sacrificio que hago, sino una gracia que Dios me otorga.»","s":"","d":"Gratitud profunda hacia la vocación y el llamado de Dios."},{"t":"«Yo amo la China y a los chinos; en medio de ellos quiero morir, y entre ellos ser sepultado.»","s":"","d":"Entrega total y amor incondicional al pueblo que acompañó."},{"t":"«El mejor lugar en el mundo será siempre aquél en donde Dios me quiera.»","s":"","d":"Disponibilidad apostólica y confianza total en la Divina Providencia."}]},{"id":"mision","nav":"Misión","type":"cards","cls":"g3","k":"Eje pastoral y metodología","title":"Introducción a la misión verbita","items":[{"t":"01. Inculturación real","s":"No imponemos, nos encarnamos.","d":"Aprendemos a ver el rostro de Dios en cada cultura y realidad local, asumiendo costumbres, idioma y estilo de vida con profundo respeto."},{"t":"02. Construir puentes","s":"No fortalezas ni barreras.","d":"Las diferencias culturales no son un problema o una barrera, sino una revelación de cómo el amor de Dios adopta distintos rostros en el mundo."},{"t":"03. La oración como motor","s":"Sostén de la labor misionera.","d":"«Un misionero sin oración es como un pájaro sin alas». La misión no es puro activismo humano; es una obra que se sostiene de rodillas."}]},{"id":"vida","nav":"Su vida","type":"cards","cls":"col","k":"Biografía completa","title":"Vida de San José Freinademetz: de los Alpes a China","items":[{"t":"1. Infancia montañesa (1852)","s":"","d":"Nació el 15 de abril de 1852 en Oies, aldea de los Alpes Dolomitas (Sur del Tirol). Creció en una familia muy humilde y religiosa, en un entorno de montaña rudo y de mucho trabajo."},{"t":"2. Vocación y sacerdocio (1875–1878)","s":"","d":"Ordenado sacerdote diocesano en 1875. Pese a ser muy querido en su parroquia, sintió el llamado misionero y en 1878 ingresó a la casa misionera de Steyl (Sociedad del Verbo Divino)."},{"t":"3. Llegada a China (1879–1881)","s":"","d":"En 1879 partió a China con Juan Bautista Anzer. En 1881 inició su labor en Shandong meridional, una región difícil donde al principio solo existían 158 católicos."},{"t":"4. Obra misionera e inculturación","s":"","d":"Decidió «hacerse chino con los chinos»: adoptó vestimenta, costumbres e idioma. Formó catequistas laicos, preparó manuales en chino y acompañó comunidades dejando más de 45.000 cristianos."},{"t":"5. Entrega final y canonización (1908–2003)","s":"","d":"Murió el 28 de enero de 1908 en Taikia al cuidar enfermos durante una epidemia de tifus. Fue beatificado en 1975 y canonizado por San Juan Pablo II en Roma el 5 de octubre de 2003."}]},{"id":"tiempo","nav":"Línea de tiempo","type":"timeline","k":"Cronología principal","title":"Línea del tiempo: acontecimientos históricos","items":[{"y":"1852","t":"Nacimiento","d":"Nace en Oies, Tirol del Sur."},{"y":"1875","t":"Sacerdocio","d":"Ordenación sacerdotal diocesana."},{"y":"1878","t":"Steyl","d":"Ingresa en los Misioneros Verbitas."},{"y":"1879","t":"Partida","d":"Recibe la cruz misionera y viaja a China."},{"y":"1881","t":"Shandong","d":"Inicia misión en Shandong meridional."},{"y":"1893","t":"Catequesis","d":"Prepara manuales y forma catequistas."},{"y":"1908","t":"Pascua","d":"Muere abnegadamente en Taikia."},{"y":"2003","t":"Canonización","d":"Santo por San Juan Pablo II."}]},{"id":"familia","nav":"Congregaciones","type":"cards","cls":"g3","k":"Presentación de siglas y ramas","title":"La Familia Misionera Verbita: las tres congregaciones","items":[{"t":"SVD","s":"Sociedad del Verbo Divino","d":"Misioneros Verbitas · Rama masculina activa\nEvangelización, educación, comunicación, parroquias y justicia social."},{"t":"SSpS","s":"Siervas del Espíritu Santo","d":"Misioneras del Espíritu Santo · Rama femenina activa\nServicio comunitario, promoción de la mujer, salud y educación de marginados."},{"t":"SSpSAP","s":"Siervas del Espíritu Santo de Adoración Perpetua","d":"«Hermanas Rosadas» · Rama contemplativa\nOración silenciosa, clausura y adoración perpetua como motor espiritual."}]},{"id":"detalle","nav":"Cada rama","type":"tabs","k":"Conocé cada rama","title":"SVD, SSpS y SSpSAP en detalle","items":[{"t":"SVD","s":"Rama masculina activa (Misioneros Verbitas)","d":"Origen y significado|Proviene del latín Societas Verbi Divini (Sociedad del Verbo Divino). Sus integrantes son conocidos popularmente como Misioneros Verbitas.\nCarisma y sello distintivo|Es la única rama masculina de la Familia Misionera. Su carisma central es la misión ad gentes: llevar el Evangelio a lugares donde no se conoce o donde la Iglesia local aún no está madura.\nCampos de acción principal|Trabajan activamente en la educación, animación parroquial, medios de comunicación social, justicia y paz, e inculturación profunda en las comunidades locales."},{"t":"SSpS","s":"Rama femenina activa","d":"Origen y significado|Proviene del latín Servae Spiritus Sancti (Misioneras Siervas del Espíritu Santo). Constituyen la congregación misionera de vida activa femenina.\nCarisma y enfoque comunitario|A diferencia de la rama sacerdotal, el enfoque de las SSpS se vuelca directamente hacia el servicio comunitario, la promoción integral de la mujer y el acompañamiento a las familias.\nPresencia en zonas de frontera|Se dedican al cuidado de la salud, educación de los más marginados y pastoral social en contextos de extrema necesidad económica, cultural y espiritual."},{"t":"SSpSAP","s":"Rama contemplativa («Hermanas Rosadas»)","d":"Origen y nombre popular|Del latín Servae Spiritus Sancti de Adoratione Perpetua. Son conocidas cariñosamente como las «Hermanas Rosadas» por el distintivo color de su hábito mariano.\nVida contemplativa y clausura|A diferencia de las congregaciones activas, permanecen en el convento dedicadas por completo a la oración silenciosa y a la adoración perpetua ante el Santísimo Sacramento.\nEl motor espiritual de la misión|Su misión específica es ser el corazón y sostén orante que respalda la labor evangelizadora de los sacerdotes SVD y de las hermanas activas SSpS en todo el mundo."}]},{"id":"carisma","nav":"Carisma","type":"cards","cls":"g2","k":"Integración pastoral","title":"Carisma, espiritualidad, valores y servicio","items":[{"t":"Espiritualidad","s":"","d":"• Fe viva y oración constante.\n• Eucaristía como centro.\n• Meditación de la Palabra.\n• Disponibilidad misionera total."},{"t":"Valores clave","s":"","d":"• Amor concreto al prójimo.\n• Humildad y sencillez de vida.\n• Respeto profundo por las culturas.\n• Solidaridad y perseverancia."},{"t":"Destinatarios","s":"","d":"• Comunidades locales de Shandong.\n• Familias en situación vulnerable.\n• Catequistas y sacerdotes locales.\n• Personas excluidas o alejadas."},{"t":"Formas de servicio","s":"","d":"• Formación de catequistas laicos.\n• Elaboración de manuales en chino.\n• Acompañamiento a sacerdotes.\n• Visita a comunidades aisladas."}]},{"id":"mapa","nav":"Mapa","type":"map","k":"Presencia mundial en más de 48 países","title":"Misión en el mundo y mapa interactivo","sub":"El legado de San José Freinademetz y los Misioneros Verbitas se expande hoy por los cinco continentes. Tocá un punto para ver su información, o seguí el recorrido de su vida."},{"id":"fuentes","nav":"Canonización","type":"cards","cls":"g2","k":"Documentación y fuentes oficiales","title":"Galería histórica y canonización en Roma (2003) onero del amor y del encuentro, enséñanos a escuchar antes de juzgar, a respetar las culturas y a acercarnos con humildad.\n\nAyúdanos a servir a quienes más lo necesitan, a trabajar por la paz y la fraternidad, y a recordar que el amor se demuestra con hechos.\n\nQue tu ejemplo nos anime a construir puentes, a acompañar a cada persona con dignidad y a vivir una fe abierta, generosa y solidaria. Amén.»"},{"t":"¿Qué nos enseña su vida?","s":"","d":"1. Escuchar: conocer a las personas y su realidad antes de intentar ayudarlas.\n2. Respetar: valorar profundamente las culturas y las formas de vida diferentes.\n3. Servir: convertir nuestras convicciones en acciones solidarias y concretas.\n4. Construir puentes: acompañar sin imponer, recordando que el amor es el único lenguaje universal."}]}],"m":[{"n":"Oies, Tirol del Sur","x":191.9,"y":43.4,"r":1,"d":"1852 · Nace José Freinademetz en una aldea de los Alpes Dolomitas.","c":"Recorrido"},{"n":"Steyl, Países Bajos","x":186.1,"y":38.6,"r":2,"d":"1878 · Ingresa en la casa misionera de la Sociedad del Verbo Divino.","c":"Recorrido"},{"n":"Taikia, Shandong (China)","x":296.6,"y":54.6,"r":3,"d":"1879–1908 · Misiona entre el pueblo chino y muere en 1908 cuidando enfermos de tifus.","c":"Recorrido"},{"n":"Roma, Italia","x":192.5,"y":48.1,"r":4,"d":"2003 · Canonización en la Plaza de San Pedro por San Juan Pablo II.","c":"Recorrido"},{"n":"Argentina","c":"América","x":121.6,"y":124.6,"g":["SVD","SSpS","SSpSAP"],"d":"Presencia: SVD · SSpS · SSpSAP. Completá aquí las obras concretas de este país, confirmadas con fuentes oficiales."},{"n":"Paraguay","c":"América","x":122.4,"y":115.3,"g":["SVD","SSpS"],"d":"Presencia: SVD · SSpS. Completá aquí las obras concretas de este país, confirmadas con fuentes oficiales."},{"n":"Brasil","c":"América","x":132.1,"y":105.8,"g":["SVD","SSpS","SSpSAP"],"d":"Presencia: SVD · SSpS · SSpSAP. Completá aquí las obras concretas de este país, confirmadas con fuentes oficiales."},{"n":"Chile","c":"América", const DEF={h:{k:"San José Freinademetz",t:"Apóstol y Misionero en China",q:"«El idioma que todos entienden es el amor»",w:"¡Sean bienvenidos hermanos y hermanas, a un espacio inspirado en el primer misionero verbita en China, donde la fe se hace encuentro y el amor derriba todas las fronteras!"},
s:[
{id:"frases",nav:"Frases",type:"cards",cls:"g2",k:"Pensamiento y testimonio",title:"Frases célebres de San José Freinademetz",items:[
{t:"«El amor es el único lenguaje que comprenden todos los hombres.»",s:"",d:"Principio fundamental de su apostolado e inculturación en China."},
{t:"«Llegar a ser misionero no es un sacrificio que hago, sino una gracia que Dios me otorga.»",s:"",d:"Gratitud profunda hacia la vocación y el llamado de Dios."},
{t:"«Yo amo la China y a los chinos; en medio de ellos quiero morir, y entre ellos ser sepultado.»",s:"",d:"Entrega total y amor incondicional al pueblo que acompañó."},
{t:"«El mejor lugar en el mundo será siempre aquél en donde Dios me quiera.»",s:"",d:"Disponibilidad apostólica y confianza total en la Divina Providencia."}]},
{id:"mision",nav:"Misión",type:"cards",cls:"g3",k:"Eje pastoral y metodología",title:"Introducción a la misión verbita",items:[
{t:"01. Inculturación real",s:"No imponemos, nos encarnamos.",d:"Aprendemos a ver el rostro de Dios en cada cultura y realidad local, asumiendo costumbres, idioma y estilo de vida con profundo respeto."},
{t:"02. Construir puentes",s:"No fortalezas ni barreras.",d:"Las diferencias culturales no son un problema o una barrera, sino una revelación de cómo el amor de Dios adopta distintos rostros en el mundo."},
{t:"03. La oración como motor",s:"Sostén de la labor misionera.",d:"«Un misionero sin oración es como un pájaro sin alas». La misión no es puro activismo humano; es una obra que se sostiene de rodillas."}]},
{id:"vida",nav:"Su vida",type:"cards",cls:"col",k:"Biografía completa",title:"Vida de San José Freinademetz: de los Alpes a China",items:[
{t:"1. Infancia montañesa (1852)",s:"",d:"Nació el 15 de abril de 1852 en Oies, aldea de los Alpes Dolomitas (Sur del Tirol). Creció en una familia muy humilde y religiosa, en un entorno de montaña rudo y de mucho trabajo."},
{t:"2. Vocación y sacerdocio (1875–1878)",s:"",d:"Ordenado sacerdote diocesano en 1875. Pese a ser muy querido en su parroquia, sintió el llamado misionero y en 1878 ingresó a la casa misionera de Steyl (Sociedad del Verbo Divino)."},
{t:"3. Llegada a China (1879–1881)",s:"",d:"En 1879 partió a China con Juan Bautista Anzer. En 1881 inició su labor en Shandong meridional, una región difícil donde al principio solo existían 158 católicos."},
{t:"4. Obra misionera e inculturación",s:"",d:"Decidió «hacerse chino con los chinos»: adoptó vestimenta, costumbres e idioma. Formó catequistas laicos, preparó manuales en chino y acompañó comunidades dejando más de 45.000 cristianos."},
{t:"5. Entrega final y canonización (1908–2003)",s:"",d:"Murió el 28 de enero de 1908 en Taikia al cuidar enfermos durante una epidemia de tifus. Fue beatificado en 1975 y canonizado por San Juan Pablo II en Roma el 5 de octubre de 2003."}]},

{y:"1852",t:"Nacimiento",d:"Nace en Oies, Tirol del Sur."},{y:"1875",t:"Sacerdocio",d:"Ordenación sacerdotal diocesana."},{y:"1878",t:"Steyl",d:"Ingresa en los Misioneros Verbitas."},{y:"1879",t:"Partida",d:"Recibe la cruz misionera y viaja a China."},{y:"1881",t:"Shandong",d:"Inicia misión en Shandong meridional."},{y:"1893",t:"Catequesis",d:"Prepara manuales y forma catequistas."},{y:"1908",t:"Pascua",d:"Muere abnegadamente en Taikia."},{y:"2003",t:"Canonización",d:"Santo por San Juan Pablo II."}]},

{t:"SSpS",s:"Siervas del Espíritu Santo",d:"Misioneras del Espíritu Santo · Rama femenina activa\nServicio comunitario, promoción de la mujer, salud y educación de marginados."},
{t:"SSpSAP",s:"Siervas del Espíritu Santo de Adoración Perpetua",d:"«Hermanas Rosadas» · Rama contemplativa\nOración silenciosa, clausura y adoración perpetua como motor espiritual."}]},
{id:"detalle",nav:"Cada rama",type:"tabs",k:"Conocé cada rama",title:"SVD, SSpS y SSpSAP en detalle",items:[
{t:"SVD",s:"Rama masculina activa (Misioneros Verbitas)",d:"Origen y significado|Proviene del latín Societas Verbi Divini (Sociedad del Verbo Divino). Sus integrantes son conocidos popularmente como Misioneros Verbitas.\nCarisma y sello distintivo|Es la única rama masculina de la Familia Misionera. Su carisma central es la misión ad gentes: llevar el Evangelio a lugares donde no se conoce o donde la Iglesia local aún no está madura.\nCampos de acción principal|Trabajan activamente en la educación, animación parroquial, medios de comunicación social, justicia y paz, e inculturación profunda en las comunidades locales."},
{t:"SSpS",s:"Rama femenina activa",d:"Origen y significado|Proviene del latín Servae Spiritus Sancti (Misioneras Siervas del Espíritu Santo). Constituyen la congregación misionera de vida activa femenina.\nCarisma y enfoque comunitario|A diferencia de la rama sacerdotal, el enfoque de las SSpS se vuelca directamente hacia el servicio comunitario, la promoción integral de la mujer y el acompañamiento a las familias.\nPresencia en zonas de frontera|Se dedican al cuidado de la salud, educación de los más marginados y pastoral social en contextos de extrema necesidad económica, cultural y espiritual."},
{t:"SSpSAP",s:"Rama contemplativa («Hermanas Rosadas»)",d:"Origen y nombre popular|Del latín Servae Spiritus Sancti de Adoratione Perpetua. Son conocidas cariñosamente como las «Hermanas Rosadas» por el distintivo color de su hábito mariano.\nVida contemplativa y clausura|A diferencia de las congregaciones activas, permanecen en el convento dedicadas por completo a la oración silenciosa y a la adoración perpetua ante el Santísimo Sacramento.\nEl motor espiritual de la misión|Su misión específica es ser el corazón y sostén orante que respalda la labor evangelizadora de los sacerdotes SVD y de las hermanas activas SSpS en todo el mundo."}]},
{id:"carisma",nav:"Carisma",type:"cards",cls:"g2",k:"Integración pastoral",title:"Carisma, espiritualidad, valores y servicio",items:[
{t:"Espiritualidad",s:"",d:"• Fe viva y oración constante.\n• Eucaristía como centro.\n• Meditación de la Palabra.\n• Disponibilidad misionera total."},
{t:"Valores clave",s:"",d:"• Amor concreto al prójimo.\n• Humildad y sencillez de vida.\n• Respeto profundo por las culturas.\n• Solidaridad y perseverancia."},
{t:"Destinatarios",s:"",d:"• Comunidades locales de Shandong.\n• Familias en situación vulnerable.\n• Catequistas y sacerdotes locales.\n• Personas excluidas o alejadas."},
{t:"Formas de servicio",s:"",d:"• Formación de catequistas laicos.\n• Elaboración de manuales en chino.\n• Acompañamiento a sacerdotes.\n• Visita a comunidades aisladas."}]},
{id:"mapa",nav:"Mapa",type:"map",k:"Presencia mundial en más de 48 países",title:"Misión en el mundo y mapa interactivo",sub:"El legado de San José Freinademetz y los Misioneros Verbitas se expande hoy por los cinco continentes. Tocá un punto para ver su información, o seguí el recorrido de su vida."},

$('lok').onclick=async()=>{const u=$('lu').value,p=$('lp').value,e=$('le');if(!u.trim()||p.length<6){e.textContent='Usuario y contraseña de al menos 6 caracteres.';return}
 try{if(!D.auth){if(p!==$('lp2').value){e.textContent='Las contraseñas no coinciden.';return}const salt=Array.from(crypto.getRandomValues(new Uint8Array(8))).join('');D.auth={salt,hash:await hs(u,p,salt)};dirty=true}
 else if(await hs(u,p,D.auth.salt)!==D.auth.hash){e.textContent='Usuario o contraseña incorrectos.';return}
 authed=true;editing=true;$('lg').classList.remove('on');render()}catch(x){e.textContent='Este navegador no permite el cifrado necesario.'}};
const cc=(x,y)=>x<150?'América':x<215&&y<60?'Europa':x<225?'África':x>=300&&y>95?'Oceanía':'Asia';
const vis=()=>D.m.map((m,k)=>[m,k]).filter(([m])=>(cont==='Recorrido'?m.r:(cont==='Todos'||m.c===cont))&&(cg==='Todas'||(m.g||[]).includes(cg)));
function drawMap(){const b=$('mapbox');if(!b)return;const w=360/z,h=180/z,x0=Math.max(0,Math.min(360-w,cx-w/2)),y0=Math.max(0,Math.min(180-h,cy-h/2)),r=3.2/Math.pow(z,.6),V=vis(),m=D.m[sel];
 const rt=playing?'':cont==='Recorrido'?D.ph.map(p=>p.x+','+p.y).join(' '):cont==='Todos'?D.m.filter(q=>q.r).sort((a,c)=>a.r-c.r).map(q=>q.x+','+q.y).join(' '):'';
 b.innerHTML=`${legend()}<div class="tabs">${['Todos','Recorrido','América','Europa','África','Asia','Oceanía'].map(c=>`<button class="${c===cont?'on':''}" data-c="${c}">${c}</button>`).join('')}</div><div class="mapw"><svg id="mp" viewBox="${x0} ${y0} ${w} ${h}"><g class="land">${LAND.map(p=>`<polygon points="${p}"/>`).join('')}</g><polyline class="route" points="${rt}"/>${cont==='Recorrido'?PP(r):''}${(cont==='Recorrido'?[]:V).map(([q,k],i)=>`<g class="pin${k===sel?' on':''}" data-k="${k}" style="--i:${i}" transform="translate(${q.x},${q.y})">${dots(q,r)}<circle class="pulse" r="${r}"/></g>`).join('')}</svg><div class="ban" id="ban">${cont==='Recorrido'?banHTML(ph):''}</div><div class="mc"><button data-z="1">＋</button><button data-z="-1">－</button><button data-z="0">⟲</button><button data-z="p">▶ Recorrido</button></div></div>
 <div class="tabs sm" style="margin-top:12px${cont==='Recorrido'?';display:none':''}">${V.map(([q,k])=>`<button class="${k===sel?'on':''}" data-k2="${k}">${esc(q.n)}</button>`).join('')}</div><p class="hint">Modo edición: tocá un lugar vacío del mapa para agregar un país o punto nuevo.</p>
 ${m&&cont!=='Recorrido'?`<div class="card info">${E(`m.${sel}.n`,m.n,'h3')}${E(`m.${sel}.d`,m.d,'p','d')}${editing?`<button class="add" data-mdel="1">Borrar este punto</button>`:''}</div>`:''}${cont==='Recorrido'?phCards():''}<p class="nt">Según las propias congregaciones, la SVD está en unos 79 países y las SSpS en unos 46 a 50. La lista cargada es una base a completar y confirmar con fuentes oficiales. Los marcadores muestran ubicaciones aproximadas. Las obras concretas de cada país deben confirmarse con fuentes oficiales.</p>`}
function fly(tz,tx,ty){const z0=z,x0=cx,y0=cy,t0=performance.now();const st=t=>{const p=Math.min(1,(t-t0)/850),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;z=z0+(tz-z0)*e;cx=x0+(tx-x0)*e;cy=y0+(ty-y0)*e;const w=360/z,h=180/z,sv=$('mp');if(sv)sv.setAttribute('viewBox',Math.max(0,Math.min(360-w,cx-w/2))+' '+Math.max(0,Math.min(180-h,cy-h/2))+' '+w+' '+h);if(p<1)requestAnimationFrame(st);else drawMap()};requestAnimationFrame(st)}
function play(){cancelAnimationFrame(anim);clearInterval(timer);const tok=++pt;cont='Recorrido';z=1;cx=190;cy=60;const P=D.ph;if(P.length<2)return;playing=true;ph=0;drawMap();
 const sv=$('mp'),ns='http://www.w3.org/2000/svg',ln=document.createElementNS(ns,'polyline'),tv=document.createElementNS(ns,'circle');ln.setAttribute('class','route');tv.setAttribute('r','2.6');tv.setAttribute('fill','#c08a28');tv.setAttribute('stroke','#fff');tv.setAttribute('stroke-width','.8');sv.insertBefore(ln,sv.querySelector('.pp'));sv.appendChild(tv);
 const show=k=>{ph=k;$('ban').innerHTML=banHTML(k);document.querySelectorAll('.pp').forEach(g=>g.classList.toggle('on',+g.dataset.pk===k));document.querySelectorAll('[data-pc]').forEach(c=>c.classList.toggle('on',+c.dataset.pc===k))};
 let s=0,t0=performance.now();const pts=[[P[0].x,P[0].y]];show(0);
 const step=t=>{if(tok!==pt)return;const a=P[s],b=P[s+1],T=Math.max(1700,Math.hypot(b.x-a.x,b.y-a.y)*32),p=Math.min(1,(t-t0)/T),x=a.x+(b.x-a.x)*p,y=a.y+(b.y-a.y)*p;tv.setAttribute('cx',x);tv.setAttribute('cy',y);ln.setAttribute('points',pts.map(q=>q.join(',')).join(' ')+' '+x+','+y);
  if(p<1){anim=requestAnimationFrame(step);return}pts.push([b.x,b.y]);s++;show(s);if(s<P.length-1)setTimeout(()=>{if(tok!==pt)return;t0=performance.now();anim=requestAnimationFrame(step)},1400);else playing=false};
 anim=requestAnimationFrame(step)}
function play2(){cancelAnimationFrame(anim);clearInterval(timer);cont='Recorrido';z=1;cx=190;cy=60;const P=D.m.filter(m=>m.r).sort((a,b)=>a.r-b.r);if(P.length<2)return;playing=true;sel=D.m.indexOf(P[0]);drawMap();
 const sv=$('mp'),ns='http://www.w3.org/2000/svg',ln=document.createElementNS(ns,'polyline'),tv=document.createElementNS(ns,'circle');ln.setAttribute('class','route');tv.setAttribute('r','2.6');tv.setAttribute('fill','#c08a28');tv.setAttribute('stroke','#fff');tv.setAttribute('stroke-width','.8');sv.appendChild(ln);sv.appendChild(tv);
 const show=k=>{sel=k;document.querySelectorAll('.pin').forEach(g=>g.classList.toggle('on',+g.dataset.k===k));const i=document.querySelector('.info');if(i&&i.children[1]){i.children[0].textContent=D.m[k].n;i.children[1].textContent=D.m[k].d}};
 let s=0,t0=performance.now();const pts=[[P[0].x,P[0].y]];show(D.m.indexOf(P[0]));
 const step=t=>{const a=P[s],b=P[s+1],p=Math.min(1,(t-t0)/2600),x=a.x+(b.x-a.x)*p,y=a.y+(b.y-a.y)*p;tv.setAttribute('cx',x);tv.setAttribute('cy',y);ln.setAttribute('points',pts.map(q=>q.join(',')).join(' ')+' '+x+','+y);
  if(p<1){anim=requestAnimationFrame(step);return}pts.push([b.x,b.y]);show(D.m.indexOf(b));s++;if(s<P.length-1)setTimeout(()=>{if(!playing)return;t0=performance.now();anim=requestAnimationFrame(step)},1100);else playing=false};
 anim=requestAnimationFrame(step)}
function playOld(){clearInterval(timer);cont='Recorrido';const rt=D.m.map((m,k)=>[m.r,k]).filter(a=>a[0]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);let n=0;const go=()=>{if(n>=rt.length){clearInterval(timer);fly(1,190,60);return}sel=rt[n++];drawMap();fly(3,D.m[sel].x,D.m[sel].y)};z=1;cx=190;cy=60;go();timer=setInterval(go,3300)}
document.addEventListener('click',e=>{const d=e.target.dataset||{};if(d.c||d.k2!==undefined||(d.z!==undefined&&d.z!=='p')||e.target.closest('.pin')){pt++;cancelAnimationFrame(anim);if(playing){playing=false;drawMap()}}if(d.c){clearInterval(timer);cont=d.c;const V=vis();if(V.length)sel=V[0][1];drawMap();if(V.length&&cont!=='Todos'&&cont!=='Recorrido'){const xs=V.map(a=>a[0].x),ys=V.map(a=>a[0].y),sp=Math.max(Math.max(...xs)-Math.min(...xs),(Math.max(...ys)-Math.min(...ys))*2,40);fly(Math.min(3.5,330/sp),(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2)}else fly(1,190,60)}
 if(d.k2!==undefined){clearInterval(timer);sel=+d.k2;drawMap();fly(Math.max(z,3),D.m[sel].x,D.m[sel].y)}
 const pc=e.target.closest&&e.target.closest('[data-pk]');if(d.cg){pt++;cancelAnimationFrame(anim);playing=false;cg=d.cg;if(cont==='Recorrido')cont='Todos';const V=vis();if(V.length)sel=V[0][1];drawMap();fly(1,190,60)}if(pc&&!editing&&cont==='Recorrido'){pt++;cancelAnimationFrame(anim);playing=false;ph=+pc.dataset.pk;drawMap()}
 if(d.pdel!==undefined){D.ph.splice(+d.pdel,1);ph=0;dirty=true;drawMap()}
 if(d.padd){const l=D.ph[D.ph.length-1]||{x:190,y:60};D.ph.push({t:'Nueva fase',a:'Año',n:'Lugar',d:'Descripción',x:l.x,y:l.y});dirty=true;drawMap()}});
render();
