<script id="data" type="application/json">{"h":{"k":"San José Freinademetz","t":"Apóstol y Misionero en China","q":"«El idioma que todos entienden es el amor»","w":"¡Sean bienvenidos hermanos y hermanas, a un espacio inspirado en el primer misionero verbita en China, donde la fe se hace encuentro y el amor derriba todas las fronteras!"},"s":[{"id":"frases","nav":"Frases","type":"cards","cls":"g2","k":"Pensamiento y testimonio","title":"Frases célebres de San José Freinademetz","items":[{"t":"«El amor es el único lenguaje que comprenden todos los hombres.»","s":"","d":"Principio fundamental de su apostolado e inculturación en China."},{"t":"«Llegar a ser misionero no es un sacrificio que hago, sino una gracia que Dios me otorga.»","s":"","d":"Gratitud profunda hacia la vocación y el llamado de Dios."},{"t":"«Yo amo la China y a los chinos; en medio de ellos quiero morir, y entre ellos ser sepultado.»","s":"","d":"Entrega total y amor incondicional al pueblo que acompañó."},{"t":"«El mejor lugar en el mundo será siempre aquél en donde Dios me quiera.»","s":"","d":"Disponibilidad apostólica y confianza total en la Divina Providencia."}]},{"id":"mision","nav":"Misión","type":"cards","cls":"g3","k":"Eje pastoral y metodología","title":"Introducción a la misión verbita","items":[{"t":"01. Inculturación real","s":"No imponemos, nos encarnamos.","d":"Aprendemos a ver el rostro de Dios en cada cultura y realidad local, asumiendo costumbres, idioma y estilo de vida con profundo respeto."},{"t":"02. Construir puentes","s":"No fortalezas ni barreras.","d":"Las diferencias culturales no son un problema o una barrera, sino una revelación de cómo el amor de Dios adopta distintos rostros en el mundo."},{"t":"03. La oración como motor","s":"Sostén de la labor misionera.","d":"«Un misionero sin oración es como un pájaro sin alas». La misión no es puro activismo humano; es una obra que se sostiene de rodillas."}]},{"id":"vida","nav":"Su vida","type":"cards","cls":"col","k":"Biografía completa","title":"Vida de San José Freinademetz: de los Alpes a China","items":[{"t":"1. Infancia montañesa (1852)","s":"","d":"Nació el 15 de abril de 1852 en Oies, aldea de los Alpes Dolomitas (Sur del Tirol). Creció en una familia muy humilde y religiosa, en un entorno de montaña rudo y de mucho trabajo."},{"t":"2. Vocación y sacerdocio (1875–1878)","s":"","d":"Ordenado sacerdote diocesano en 1875. Pese a ser muy querido en su parroquia, sintió el llamado misionero y en 1878 ingresó a la casa misionera de Steyl (Sociedad del Verbo Divino)."},{"t":"3. Llegada a China (1879–1881)","s":"","d":"En 1879 partió a China con Juan Bautista Anzer. En 1881 inició su labor en Shandong meridional, una región difícil donde al principio solo existían 158 católicos."},{"t":"4. Obra misionera e inculturación","s":"","d":"Decidió «hacerse chino con los chinos»: adoptó vestimenta, costumbres e idioma. Formó catequistas laicos, preparó manuales en chino y acompañó comunidades dejando más de 45.000 cristianos."},{"t":"5. Entrega final y canonización (1908–2003)","s":"","d":"Murió el 28 de enero de 1908 en Taikia al cuidar enfermos durante una epidemia de tifus. Fue beatificado en 1975 y canonizado por San Juan Pablo II en Roma el 5 de octubre de 2003."}]},{"id":"tiempo","nav":"Línea de tiempo","type":"timeline","k":"Cronología principal","title":"Línea del tiempo: acontecimientos históricos","items":[{"y":"1852","t":"Nacimiento","d":"Nace en Oies, Tirol del Sur."},{"y":"1875","t":"Sacerdocio","d":"Ordenación sacerdotal diocesana."},{"y":"1878","t":"Steyl","d":"Ingresa en los Misioneros Verbitas."},{"y":"1879","t":"Partida","d":"Recibe la cruz misionera y viaja a China."},{"y":"1881","t":"Shandong","d":"Inicia misión en Shandong meridional."},{"y":"1893","t":"Catequesis","d":"Prepara manuales y forma catequistas."},{"y":"1908","t":"Pascua","d":"Muere abnegadamente en Taikia."},{"y":"2003","t":"Canonización","d":"Santo por San Juan Pablo II."}]},{"id":"familia","nav":"Congregaciones","type":"cards","cls":"g3","k":"Presentación de siglas y ramas","title":"La Familia Misionera Verbita: las tres congregaciones","items":[{"t":"SVD","s":"Sociedad del Verbo Divino","d":"Misioneros Verbitas · Rama masculina activa\nEvangelización, educación, comunicación, parroquias y justicia social."},{"t":"SSpS","s":"Siervas del Espíritu Santo","d":"Misioneras del Espíritu Santo · Rama femenina activa\nServicio comunitario, promoción de la mujer, salud y educación de marginados."},{"t":"SSpSAP","s":"Siervas del Espíritu Santo de Adoración Perpetua","d":"«Hermanas Rosadas» · Rama contemplativa\nOración silenciosa, clausura y adoración perpetua como motor espiritual."}]},{"id":"detalle","nav":"Cada rama","type":"tabs","k":"Conocé cada rama","title":"SVD, SSpS y SSpSAP en detalle","items":[{"t":"SVD","s":"Rama masculina activa (Misioneros Verbitas)","d":"Origen y significado|Proviene del latín Societas Verbi Divini (Sociedad del Verbo Divino). Sus integrantes son conocidos popularmente como Misioneros Verbitas.\nCarisma y sello distintivo|Es la única rama masculina de la Familia Misionera. Su carisma central es la misión ad gentes: llevar el Evangelio a lugares donde no se conoce o donde la Iglesia local aún no está madura.\nCampos de acción principal|Trabajan activamente en la educación, animación parroquial, medios de comunicación social, justicia y paz, e inculturación profunda en las comunidades locales."},{"t":"SSpS","s":"Rama femenina activa","d":"Origen y significado|Proviene del latín Servae Spiritus Sancti (Misioneras Siervas del Espíritu Santo). Constituyen la congregación misionera de vida activa femenina.\nCarisma y enfoque comunitario|A diferencia de la rama sacerdotal, el enfoque de las SSpS se vuelca directamente hacia el servicio comunitario, la promoción integral de la mujer y el acompañamiento a las familias.\nPresencia en zonas de frontera|Se dedican al cuidado de la salud, educación de los más marginados y pastoral social en contextos de extrema necesidad económica, cultural y espiritual."},{"t":"SSpSAP","s":"Rama contemplativa («Hermanas Rosadas»)","d":"Origen y nombre popular|Del latín Servae Spiritus Sancti de Adoratione Perpetua. Son conocidas cariñosamente como las «Hermanas Rosadas» por el distintivo color de su hábito mariano.\nVida contemplativa y clausura|A diferencia de las congregaciones activas, permanecen en el convento dedicadas por completo a la oración silenciosa y a la adoración perpetua ante el Santísimo Sacramento.\nEl motor espiritual de la misión|Su misión específica es ser el corazón y sostén orante que respalda la labor evangelizadora de los sacerdotes SVD y de las hermanas activas SSpS en todo el mundo."}]},{"id":"carisma","nav":"Carisma","type":"cards","cls":"g2","k":"Integración pastoral","title":"Carisma, espiritualidad, valores y servicio","items":[{"t":"Espiritualidad","s":"","d":"• Fe viva y oración constante.\n• Eucaristía como centro.\n• Meditación de la Palabra.\n• Disponibilidad misionera total."},{"t":"Valores clave","s":"","d":"• Amor concreto al prójimo.\n• Humildad y sencillez de vida.\n• Respeto profundo por las culturas.\n• Solidaridad y perseverancia."},{"t":"Destinatarios","s":"","d":"• Comunidades locales de Shandong.\n• Familias en situación vulnerable.\n• Catequistas y sacerdotes locales.\n• Personas excluidas o alejadas."},{"t":"Formas de servicio","s":"","d":"• Formación de catequistas laicos.\n• Elaboración de manuales en chino.\n• Acompañamiento a sacerdotes.\n• Visita a comunidades aisladas."}]},{"id":"mapa","nav":"Mapa","type":"map","k":"Presencia mundial en más de 48 países","title":"Misión en el mundo y mapa interactivo","sub":"El legado de San José Freinademetz y los Misioneros Verbitas se expande hoy por los cinco continentes. Tocá un punto para ver su información, o seguí el recorrido de su vida."},{"id":"fuentes","nav":"Canonización","type":"cards","cls":"g2","k":"Documentación y fuentes oficiales","title":"Galería histórica y canonización en Roma (2003)","items":[{"t":"Acontecimiento histórico","s":"","d":"San José Freinademetz fue canonizado por San Juan Pablo II el 5 de octubre de 2003 en la Plaza de San Pedro (Roma), junto a Arnoldo Janssen y Daniel Comboni.\n\nSu tapiz gigante se expuso en la fachada de la Basílica de San Pedro como testimonio del amor misionero hacia el pueblo chino."},{"t":"Galerías y fotografías históricas","s":"","d":"• Galería histórica de la Canonización (Sociedad del Verbo Divino)\n• Biografía oficial del Vaticano (Santa Sede)\n• Retrato histórico y obra teatral misionera (UCA News)\n• Galería de arte sobre San Giuseppe Freinademetz\n• Fotografías y recuerdos misioneros (SVD España)"}]},{"id":"fotos","nav":"Fotos","type":"gallery","k":"Galería","title":"Fotos históricas y recuerdos","items":[]},{"id":"oracion","nav":"Oración","type":"cards","cls":"g2 pr","k":"Oración y aprendizaje pastoral","title":"Oración a San José Freinademetz y legado","items":[{"t":"Oración a San José Freinademetz","s":"","d":"«San José Freinademetz, misionero del amor y del encuentro, enséñanos a escuchar antes de juzgar, a respetar las culturas y a acercarnos con humildad.\n\nAyúdanos a servir a quienes más lo necesitan, a trabajar por la paz y la fraternidad, y a recordar que el amor se demuestra con hechos.\n\nQue tu ejemplo nos anime a construir puentes, a acompañar a cada persona con dignidad y a vivir una fe abierta, generosa y solidaria. Amén.»"},{"t":"¿Qué nos enseña su vida?","s":"","d":"1. Escuchar: conocer a las personas y su realidad antes de intentar ayudarlas.\n2. Respetar: valorar profundamente las culturas y las formas de vida diferentes.\n3. Servir: convertir nuestras convicciones en acciones solidarias y concretas.\n4. Construir puentes: acompañar sin imponer, recordando que el amor es el único lenguaje universal."}]}],"m":[{"n":"Oies, Tirol del Sur","x":191.9,"y":43.4,"r":1,"d":"1852 · Nace José Freinademetz en una aldea de los Alpes Dolomitas.","c":"Recorrido"},{"n":"Steyl, Países Bajos","x":1 {t:"«El amor es el único lenguaje que comprenden todos los hombres.»",s:"",d:"Principio fundamental de su apostolado e inculturación en China."},
{t:"«Llegar a ser misionero no es un sacrificio que hago, sino una gracia que Dios me otorga.»",s:"",d:"Gratitud profunda hacia la vocación y el llamado de Dios."},
{t:"«Yo amo la China y a los chinos; en medio de ellos quiero morir, y entre ellos ser sepultado.»",s:"",d:"Entrega total y amor incondicional al pueblo que acompañó."},
{t:"«El mejor lugar en el mundo será siempre aquél en donde Dios me quiera.»",s:"",d:"Disponibilidad apostólica y confianza total en la Divina Providencia."}]},
{id:"mision",nav:"Misión",type:"cards",cls:"g3",k:"Eje pastoral y metodología",title:"Introducción a la misión verbita",items:[
{t:"01. Inculturación real",s:"No imponemos, nos encarnamos.",d:"Aprendemos a ver el rostro de Dios en cada cultura y realidad local, asumiendo costumbres, idioma y estilo de vida con profundo respeto."},
{t:"02. Construir puentes",s:"No fortalezas ni barreras.",d:"Las diferencias culturales no son un problema o una barrera, sino una revelación de cómo el amor de Dios adopta distintos rostros en el mundo."},
{t:"03. La oración como motor",s:"Sostén de la labor misionera.",d:"«Un misionero sin oración es como un pájaro sin alas». La misión no es puro activismo humano; es una obra que se sostiene de rodillas."}]},
{id:"vida",nav:"Su vida",type:"cards",cls:"col",k:"Biografía completa",title:"Vida de San José Freinademetz: de los Alpes a China",items:[
{t:"1. Infancia montañesa (1852)",s:"",d:"Nació el 15 de abril de 1852 en Oies, aldea de los Alpes Dolomitas (Sur del Tirol). Creció en una familia muy humilde y religiosa, en un entorno de montaña rudo y de mucho trabajo."},
{t:"2. Vocación y sacerdocio (1875–1878)",s:"",d:"Ordenado sacerdote diocesano en 1875. Pese a ser muy querido en su parroquia, sintió el llamado misionero y en 1878 ingresó a la casa misionera de Steyl (Sociedad del Verbo Divino)."},
{t:"3. Llegada a China (1879–1881)",s:"",d:"En 1879 partió a China con Juan Bautista Anzer. En 1881 inició su labor en Shandong meridional, una región difícil donde al principio solo existían 158 católicos."},
{t:"4. Obra misionera e inculturación",s:"",d:"Decidió «hacerse chino con los chinos»: adoptó vestimenta, costumbres e idioma. Formó catequistas laicos, preparó manuales en chino y acompañó comunidades dejando más de 45.000 cristianos."},
{t:"5. Entrega final y canonización (1908–2003)",s:"",d:"Murió el 28 de enero de 1908 en Taikia al cuidar enfermos durante una epidemia de tifus. Fue beatificado en 1975 y canonizado por San Juan Pablo II en Roma el 5 de octubre de 2003."}]},

{t:"SVD",s:"Rama masculina activa (Misioneros Verbitas)",d:"Origen y significado|Proviene del latín Societas Verbi Divini (Sociedad del Verbo Divino). Sus integrantes son conocidos popularmente como Misioneros Verbitas.\nCarisma y sello distintivo|Es la única rama masculina de la Familia Misionera. Su carisma central es la misión ad gentes: llevar el Evangelio a lugares donde no se conoce o donde la Iglesia local aún no está madura.\nCampos de acción principal|Trabajan activamente en la educación, animación parroquial, medios de comunicación social, justicia y paz, e inculturación profunda en las comunidades locales."},
{t:"SSpS",s:"Rama femenina activa",d:"Origen y significado|Proviene del latín Servae Spiritus Sancti (Misioneras Siervas del Espíritu Santo). Constituyen la congregación misionera de vida activa femenina.\nCarisma y enfoque comunitario|A diferencia de la rama sacerdotal, el enfoque de las SSpS se vuelca directamente hacia el servicio comunitario, la promoción integral de la mujer y el acompañamiento a las familias.\nPresencia en zonas de frontera|Se dedican al cuidado de la salud, educación de los más marginados y pastoral social en contextos de extrema necesidad económica, cultural y espiritual."},
{t:"SSpSAP",s:"Rama contemplativa («Hermanas Rosadas»)",d:"Origen y nombre popular|Del latín Servae Spiritus Sancti de Adoratione Perpetua. Son conocidas cariñosamente como las «Hermanas Rosadas» por el distintivo color de su hábito mariano.\nVida contemplativa y clausura|A diferencia de las congregaciones activas, permanecen en el convento dedicadas por completo a la oración silenciosa y a la adoración perpetua ante el Santísimo Sacramento.\nEl motor espiritual de la misión|Su misión específica es ser el corazón y sostén orante que respalda la labor evangelizadora de los sacerdotes SVD y de las hermanas activas SSpS en todo el mundo."}]},

{t:"Valores clave",s:"",d:"• Amor concreto al prójimo.\n• Humildad y sencillez de vida.\n• Respeto profundo por las culturas.\n• Solidaridad y perseverancia."},
